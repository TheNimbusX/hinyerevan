# Reverse proxy on a dedicated RU VPS → NL app server (45.138.25.76).
# Do NOT use old reg.ru 31.31.199.153 — that host is being decommissioned.

server {
    listen 80;
    server_name hinyerevan.com www.hinyerevan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hinyerevan.com www.hinyerevan.com;

    ssl_certificate /etc/letsencrypt/live/hinyerevan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hinyerevan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64M;

    location / {
        proxy_pass https://45.138.25.76;
        proxy_ssl_server_name on;
        proxy_ssl_name hinyerevan.com;
        proxy_set_header Host hinyerevan.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
