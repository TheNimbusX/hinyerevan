server {
    listen 80;
    server_name dev.hinyerevan.com www.dev.hinyerevan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/hinyerevan/frontend/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name hinyerevan.ru www.hinyerevan.ru 45.138.25.76;

    if ($host = www.hinyerevan.ru) {
        return 301 https://$host$request_uri;
    }
    if ($host = hinyerevan.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
