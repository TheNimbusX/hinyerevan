# Dev stand: hinyerevan.ru + dev.hinyerevan.com (app-level gate with captcha; no nginx basic auth).
server {
    listen 443 ssl;
    server_name hinyerevan.ru www.hinyerevan.ru 45.138.25.76;

    client_max_body_size 64M;

    root /var/www/hinyerevan/frontend/dist;
    index index.html;

    location /api {
        root /var/www/hinyerevan/backend/public;
        try_files $uri /index.php?$query_string;
    }
    location /sanctum {
        root /var/www/hinyerevan/backend/public;
        try_files $uri /index.php?$query_string;
    }
    location ~ \.php$ {
        root /var/www/hinyerevan/backend/public;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location ~ ^/photos/[0-9]+$ {
        root /var/www/hinyerevan/backend/public;
        try_files $uri /index.php?$query_string;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/hinyerevan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hinyerevan.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

