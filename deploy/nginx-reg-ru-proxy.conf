# Reverse proxy on reg.ru (31.31.199.153) → NL VPS (45.138.25.76).
# ISPmanager vhost replacement for hinyerevan.com.
# Backup original before deploy: setup-reg-ru-proxy.sh

server {
    listen 31.31.199.153:80;
    listen [2a00:f940:2:4:4::3fe]:80;
    server_name hinyerevan.com www.hinyerevan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 31.31.199.153:443 ssl http2;
    listen [2a00:f940:2:4:4::3fe]:443 ssl http2;
    server_name hinyerevan.com www.hinyerevan.com;

    ssl_certificate "/var/www/httpd-cert/hinyerevan/hinyerevan.com_le2.crtca";
    ssl_certificate_key "/var/www/httpd-cert/hinyerevan/hinyerevan.com_le2.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 64M;
    access_log /var/www/httpd-logs/hinyerevan.com.access.log;
    error_log /var/www/httpd-logs/hinyerevan.com.error.log notice;

    location / {
        proxy_pass https://45.138.25.76;
        proxy_ssl_server_name on;
        proxy_ssl_name hinyerevan.com;
        proxy_set_header Host hinyerevan.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
