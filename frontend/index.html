    <script>
      ;(function () {
        function detectInApp() {
          var ua = navigator.userAgent || ''
          if (/Telegram|FBAN|FBAV|Instagram|Line\//i.test(ua)) return true
          if (window.TelegramWebviewProxy || window.TelegramWebview) return true
          try {
            if (/t\.me|telegram\.(org|me)/i.test(document.referrer || '')) return true
          } catch (e) {}
          return false
        }

        try {
          var stored = localStorage.getItem('hinyerevan_theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark')
          } else {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }

        if (detectInApp()) {
          document.documentElement.classList.add('in-app-browser')
        }

        try {
          document.documentElement.lang = 'hy'
        } catch (e) {
          document.documentElement.lang = 'hy'
        }
        window.__splashStart = Date.now()
      })()
    </script>
    <script>
      ;(function () {
        function killSplash() {
          var splash = document.getElementById('app-splash')
          if (!splash || splash.classList.contains('is-dismissed')) return
          splash.classList.add('app-splash--hide', 'is-dismissed')
          splash.style.cssText =
            'display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important'
          window.setTimeout(function () {
            splash.remove()
          }, 60)
        }
        var inApp = document.documentElement.classList.contains('in-app-browser')
        setTimeout(killSplash, inApp ? 2200 : 3200)
        window.addEventListener('pageshow', killSplash)
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') killSplash()
        })
      })()
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(138, 165, 236, 0.12), transparent 62%),

        transition:
          opacity 0.5s ease,
          visibility 0.5s ease;
      }
      html[data-theme='light'] #app-splash {
        background:
          radial-gradient(circle at 50% 38%, rgba(41, 79, 179, 0.08), transparent 62%),
          #ffffff;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
        visibility: hidden;
      }
      /* Splash is a mobile-only intro; never show it on tablet/desktop. */
      @media (min-width: 768px) {
        #app-splash {
          display: none;
        }
      }
      .app-splash__stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        transition:
          transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.5s ease;
      }
      #app-splash.app-splash--hide .app-splash__stage {
        transform: translateY(-6px) scale(1.04);
        opacity: 0;
      }
      .app-splash__logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 150px;
        height: 150px;
      }
      .app-splash__halo {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(41, 79, 179, 0.22), transparent 70%);
        filter: blur(10px);
        animation: splashHalo 2.8s ease-in-out infinite;
      }
      html[data-theme='dark'] .app-splash__halo {
        background: radial-gradient(circle, rgba(138, 165, 236, 0.26), transparent 70%);
      }
      .app-splash__logo {
        position: relative;
        width: 116px;
        height: auto;
        opacity: 0;
        transform: scale(0.85) translateY(10px);
        animation: splashReveal 0.85s cubic-bezier(0.22, 0.8, 0.28, 1) 0.05s forwards;
        filter: drop-shadow(0 12px 24px rgba(13, 16, 24, 0.2));
      }
      html[data-theme='dark'] .app-splash__logo {
        filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.55));
      }
      .app-splash__bar {
        position: relative;
        width: 132px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: rgba(138, 165, 236, 0.16);
        opacity: 0;
        animation: splashFadeIn 0.6s ease 0.5s forwards;
      }
      html[data-theme='light'] .app-splash__bar {
        background: rgba(41, 79, 179, 0.14);
      }
      .app-splash__bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #294fb3, transparent);
        animation: splashSlide 1.25s ease-in-out infinite;
      }
      html[data-theme='dark'] .app-splash__bar::before {
        background: linear-gradient(90deg, transparent, #8aa5ec, transparent);
      }
      @keyframes splashReveal {
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes splashFadeIn {
        to {
          opacity: 1;
        }
      }
      @keyframes splashHalo {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.06);
          opacity: 0.95;
        }
      }
      @keyframes splashSlide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__logo {
          animation: splashFadeIn 0.4s ease forwards;
          transform: none;
        }
        .app-splash__halo,
        .app-splash__bar::before {
          animation: none;
        }
      }
      /* Cluster pins: orange even if the Vue CSS bundle loads late (Telegram WebView). */
      .map-cluster-pin {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        line-height: 1;
        border: 2px solid #fff;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.38) 0 16%, transparent 17%),
          linear-gradient(145deg, #ffb347, #d56f00);
        box-shadow: 0 3px 8px rgba(213, 111, 0, 0.28);
      }
      @media (max-width: 767px) {
        .map-cluster-pin {
          font-size: 10px !important;
        }
      }
      /* In-app WebViews (Telegram): backdrop-filter tints the whole page and shifts colors. */
      html.in-app-browser *,
      html.in-app-browser *::before,
      html.in-app-browser *::after {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      html.in-app-browser #app-splash.is-dismissed,
      html.in-app-browser #app-splash.app-splash--hide {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      html:not(.menu-open) .mobile-menu-backdrop {
        display: none !important;
        pointer-events: none !important;
      }
